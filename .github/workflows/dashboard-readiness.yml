name: Elysia dashboard readiness (isolated)

on:
  pull_request:
    paths:
      - "project_guardian/ui_control_panel.py"
      - "tests/test_ui_readiness_http.py"
      - "tests/test_ui_server_exit_recovery.py"
      - "tests/test_optional_numpy_fallback.py"
      - "project_guardian/memory_vector_search.py"
      - "tests/test_dashboard_listening.py"
      - "tests/test_dashboard_idempotent.py"
      - ".github/workflows/dashboard-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated UI-test dependencies (no Elysia providers)
        run: |
          python -m pip install --disable-pip-version-check pytest flask flask-socketio flask-cors cryptography pyyaml psutil httpx beautifulsoup4 lxml requests fastapi uvicorn jinja2 python-multipart
      - name: Check Python syntax
        run: |
          python -m py_compile project_guardian/ui_control_panel.py project_guardian/memory_vector_search.py tests/test_ui_readiness_http.py tests/test_optional_numpy_fallback.py tests/test_ui_server_exit_recovery.py tests/test_dashboard_listening.py tests/test_dashboard_idempotent.py
      - name: Test dashboard readiness and single-start recovery
        run: |
          python -m pytest tests/test_ui_readiness_http.py tests/test_ui_server_exit_recovery.py tests/test_dashboard_listening.py tests/test_dashboard_idempotent.py tests/test_optional_numpy_fallback.py -q
