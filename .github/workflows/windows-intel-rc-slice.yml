# Windows intelligence RC-required pytest slice on Linux and Windows.
# No credentials, live cloud providers, autonomy enablement, or BAT launchers.
name: Windows intel RC slice

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-rc-slice:
    name: Intel RC pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Wrong source SHA: $actual (expected $env:EXPECTED_SHA)"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >
          python -m pip install
          "pytest>=7.4,<9"
          "PyYAML>=6,<7"
          "httpx>=0.25,<1"
          "cryptography>=41"
          "psutil>=5.9"
          "Flask>=3,<4"
          "flask-cors>=4,<5"
          "openai>=1.0,<2"
          "beautifulsoup4>=4.12,<5"

      - name: Run RC-required Windows intelligence tests
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/run_windows_intel_rc_tests.py
