# Windows intelligence RC-required pytest slice on Linux and Windows.
# No credentials, live cloud providers, autonomy enablement, or BAT launchers.
name: Windows intel RC slice

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-rc-slice:
    name: Intel RC pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Wrong source SHA: $actual (expected $env:EXPECTED_SHA)"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-documents.txt reportlab
          python -m pip install "openai>=1.0,<2" "requests>=2.31,<3" "flask-socketio>=5,<6"

      - name: Install pinned native FAISS CPU and NumPy for synthetic acceptance
        run: |
          # Wheels only. Missing/incompatible Python 3.12 wheels fail the job.
          # This does not install any embedding model or send memory to a provider.
          python -m pip install --only-binary=:all: "numpy==1.26.4" "faiss-cpu==1.12.0"
          python -c "import faiss, numpy as np; assert callable(faiss.deserialize_index); assert np.__version__ == '1.26.4'; print('REAL FAISS', faiss.__version__, 'NUMPY', np.__version__)"

      - name: Run RC-required Windows intelligence tests
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          # Prefer CI stub over real pyttsx3 so Windows contained-write audit
          # is not polluted by comtypes SpeechLib codegen into site-packages.
          PYTHONPATH: ${{ github.workspace }}/ci_stubs
        run: python -B scripts/run_windows_intel_rc_tests.py

      - name: Test trusted-source adversarial controls
        run: python -I -B -m pytest --noconftest -q -p no:cacheprovider tests/test_trusted_memory_acceptance.py

      - name: Run pinned-source synthetic MemoryCore acceptance
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I -B scripts/trusted_memory_acceptance.py --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Preserve trusted-source acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-memory-acceptance-${{ matrix.os }}
          path: REPORTS/trusted-memory/*.json
          if-no-files-found: warn
          retention-days: 14
