name: Elysia Autopilot CI

on:
  push:
    branches:
      - 'elysia-collective-*'
      - 'autopilot-*'
      - 'codex/governance-checkpoint-contract'
      # Explicit currently supported governance families only (not */governance-*).
      - 'codex/governance-*'
      - 'cursor/governance-*'
  pull_request:
    branches:
      - main
      - 'elysia-collective-*'
      - 'autopilot-*'
      - 'codex/remote-fix-*'
      # Explicit currently supported governance families only (not */governance-*).
      - 'codex/governance-*'
      - 'cursor/governance-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected_candidate_sha=${expected}"
          echo "actual_checked_out_sha=${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "Exact candidate SHA mismatch: checked-out HEAD must equal the candidate SHA."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pytest 'jsonschema>=4.18,<5'

      - name: Compile seed Python
        run: python -m compileall -q elysia_collective_seed

      - name: Validate JSON artifacts parse
        shell: python
        run: |
          import json
          from pathlib import Path
          failures = []
          for path in Path('elysia_collective_seed').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('All JSON artifacts parsed successfully.')

      - name: Run Elysia Collective seed tests
        run: >-
          python -m pytest -q elysia_collective_seed
          tests/test_autopilot_verifier.py
          tests/test_autopilot_verifier_ledger_migration.py
          tests/test_autopilot_verifier_lifecycle.py
          tests/test_vega_verifier_boundaries.py
          tests/test_autopilot_lifecycle_repairs.py
          tests/test_vega_evidence_binding.py
          tests/test_autopilot_evidence_binding.py
          tests/test_autopilot_claim_policy.py
          breaker_tests/test_vega_v2_generation.py

      - name: Enforce no runtime-enable flag in seed prompt pack
        shell: python
        run: |
          from pathlib import Path
          path = Path('elysia_collective_seed/agent_prompt_pack.py')
          if path.exists():
              text = path.read_text(encoding='utf-8')
              if 'RUNTIME_ENABLED = True' in text:
                  raise SystemExit('Elysia seed runtime was enabled before reconciliation gate cleared.')
          print('Runtime-enable gate remains closed.')
