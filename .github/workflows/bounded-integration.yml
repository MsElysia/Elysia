name: Bounded integration evidence

on:
  push:
    branches: ['integration-evidence/**']

# Read-only hosted evidence. No secrets, providers, merge or deployment steps.
permissions:
  contents: read

jobs:
  integration:
    name: integration-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: toolkit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate inputs before candidate checkout
        shell: python
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('toolkit').resolve()))
          from elysia_collective_seed.autopilot.integration import validate, sha, validate_request_commit
          request = json.loads(Path('toolkit/integration-request.json').read_text())
          sha(request['candidate'])
          sha(request['toolkit'])
          validate_request_commit('toolkit', os.environ['EVENT_SHA'], request)
          plan = request['plan']
          validate(plan)
          Path('plan.json').write_text(json.dumps(plan), encoding='utf-8')
      - name: Checkout exact candidate without credentials
        shell: python
        run: |
          import json, subprocess
          request = json.load(open('toolkit/integration-request.json'))
          subprocess.run(['git', 'clone', '--no-checkout', 'https://github.com/MsElysia/Elysia.git', 'candidate'], check=True)
          subprocess.run(['git', 'fetch', 'origin', request['candidate']], cwd='candidate', check=True)
          subprocess.run(['git', 'checkout', '--detach', request['candidate']], cwd='candidate', check=True)
      - name: Fetch pinned source objects
        shell: python
        run: |
          import json, subprocess
          plan = json.load(open('plan.json'))
          for item in [plan['base'], *plan['sources']]:
              subprocess.run(['git', 'fetch', 'origin', item['sha']], cwd='candidate', check=True)
      - name: Audit exact tree before installing existing test dependencies
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('toolkit').resolve()))
          from elysia_collective_seed.autopilot.integration import audit
          request = json.load(open('toolkit/integration-request.json'))
          audit('candidate', request['plan'], request['candidate'])
          subprocess.run(['python', '-m', 'pip', 'install', 'pytest==8.3.5'], check=True)
          if Path('candidate/requirements.txt').exists():
              subprocess.run(['python', '-m', 'pip', 'install', '-r', 'candidate/requirements.txt'], check=True)
      - name: Run exact-head scope audit and required suites
        shell: python
        run: |
          import json, subprocess
          request = json.load(open('toolkit/integration-request.json'))
          subprocess.run(['python', 'toolkit/elysia_collective_seed/autopilot/integration.py', 'ci',
                          '--plan', 'plan.json', '--repo', 'candidate', '--candidate', request['candidate'],
                          '--result', 'evidence.json'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.platform }}
          path: evidence.json
          if-no-files-found: error
