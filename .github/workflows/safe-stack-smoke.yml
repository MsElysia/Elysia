# Safe-stack architecture smoke tests (pytest slice only).
# No services, secrets, autonomy, live execution, or external API calls.
name: Safe stack smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safe stack smoke tests
        run: python scripts/run_safe_stack_smoke_tests.py

  windows-memory-import:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw "Checkout head mismatch" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run native Windows memory import and recovery tests
        run: >-
          python -m pytest -q
          project_guardian/tests/test_windows_apply_lock.py
          project_guardian/tests/test_chatgpt_apply_transaction.py
          project_guardian/tests/test_chatgpt_export_ingest.py
          project_guardian/tests/test_memory_intelligence_ingestion.py
          project_guardian/tests/test_memory_intelligence_brain_bridge.py
          project_guardian/tests/test_issue91_disabled_autonomy_event_memory.py
          project_guardian/tests/test_startup_maintenance_boundary.py
          project_guardian/tests/test_startup_diagnostic_routing.py
          project_guardian/tests/test_monitoring_adversarial_boundary.py
          project_guardian/tests/test_offline_research_recovery.py
          tests/test_guardian_layer_explicit_activation.py
          project_guardian/tests/test_memory_candidate_review.py
          project_guardian/tests/test_approved_memory_store.py
          project_guardian/tests/test_approved_memory_search.py
          project_guardian/tests/test_approved_memory_context.py
          project_guardian/tests/test_local_memory_pipeline_smoke.py

      - name: Verify real disabled-autonomy startup preserves 4200 fictional records
        run: python -B project_guardian/tests/startup_side_effect_probe.py --scenario degraded --cycles 2
