# Safe-stack architecture smoke tests (pytest slice only).
# No services, secrets, autonomy, live execution, or external API calls.
name: Safe stack smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  safe-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safe stack smoke tests
        run: python scripts/run_safe_stack_smoke_tests.py
