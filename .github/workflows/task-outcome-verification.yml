# Deterministic self-task outcome checks. No credentials, providers, or deploy.
name: Task outcome verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome:
    name: Capability and task evidence (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw "Wrong source SHA: $actual" }

      - name: Fetch exact divergent calculator source for provenance check
        run: git fetch --no-tags --depth=1 origin 4eea564b0de97c124aea7475527e7ab542249ffc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runner test dependencies
        run: python -m pip install "pytest>=7.4,<9" openai flask flask-socketio flask-cors cryptography pyyaml psutil httpx beautifulsoup4 requests pyttsx3

      - name: Run task outcome evidence tests
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest --noconftest -q -rs -p no:cacheprovider tests/test_self_task_execution_outcome.py tests/test_memory_core_persistence.py tests/test_verified_local_calculation.py project_guardian/tests/test_lazy_memory.py
